# CA Practice Management Platform - Nginx reverse proxy (Lightsail).
# Serves app. / admin. / api. subdomains over HTTPS.
# TLS cert: /etc/letsencrypt/live/ca-platform (SAN: app+admin+api.snbajaj.com).

# ================== app.snbajaj.com (client PWA + API) ==================

server {
    listen 80 default_server;
    server_name app.snbajaj.com;
    return 301 https://app.snbajaj.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name app.snbajaj.com;

    ssl_certificate     /etc/letsencrypt/live/ca-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ca-platform/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 12m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    root /opt/ca-app/frontend/site;
    index index.html;

    # ---- API -> NestJS (:3000); keeps the SPA's relative '/api/v1' base working ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- long-cache hashed assets ----
    location ~* /.+\.(js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---- never-cache shells & service worker ----
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ---- client PWA at root ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

# ================== admin.snbajaj.com (admin SPA under /admin/) ==================

server {
    listen 80;
    server_name admin.snbajaj.com;
    return 301 https://admin.snbajaj.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.snbajaj.com;

    ssl_certificate     /etc/letsencrypt/live/ca-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ca-platform/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 12m;

    root /opt/ca-app/frontend/site;
    index index.html;

    # ---- API -> NestJS (:3000) ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- long-cache hashed assets under /admin ----
    location ~* ^/admin/.+\.(js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /admin/index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /admin {
        return 301 /admin/;
    }

    # ---- admin SPA ----
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # bare root sends people into the admin app
    location = /index.html {
        return 301 /admin/;
    }
    location / {
        return 301 /admin/;
    }
}

# ================== api.snbajaj.com (pure API reverse proxy) ==================

server {
    listen 80;
    server_name api.snbajaj.com;
    return 301 https://api.snbajaj.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.snbajaj.com;

    ssl_certificate     /etc/letsencrypt/live/ca-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ca-platform/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}