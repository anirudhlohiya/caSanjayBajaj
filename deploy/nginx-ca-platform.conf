# CA Practice Management Platform — Nginx reverse proxy (single EC2).
#
# Install:
#   1. Replace every DOMAIN below with your real domain.
#   2. sudo cp nginx-ca-platform.conf /etc/nginx/conf.d/ca-platform.conf
#   3. nginx -t && systemctl reload nginx
#
# TLS: after DNS points here and first deploy works over HTTP, run:
#   sudo certbot --nginx -d DOMAIN
# certbot rewrites this file to add the :443 block + HTTP->HTTPS redirect and
# manages the ssl_certificate lines afterwards — keep them intact.

server {
    listen 80 default_server;
    server_name DOMAIN;

    client_max_body_size 12m;          # uploads go direct-to-S3; API bodies are JSON only

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    root /opt/ca-app/frontend/site;
    index index.html;

    # ---- API -> NestJS (:3000). Global prefix api/v1; Swagger disabled in prod. ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # NOTE: nginx stops inheriting server-level add_header once a location defines
    # ANY of its own — so security headers are repeated inside every location that
    # sets Cache-Control/expires. HSTS is included too; it is harmless over :80.

    # ---- long-cache hashed static assets (/admin listed first so it wins) ----
    location ~* ^/admin/.+\.(js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ~* /.+\.(js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---- never-cache shells & service worker (exact match beats regex) ----
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /admin/index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---- admin SPA under /admin/ ----
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---- client PWA at root ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

# Manual-TLS alternative to `certbot --nginx` — duplicate ALL locations above into a
# server block like the one below, then add an :80 block that 301s to https.
#
