<button class="w-full bg-primary text-on-primary rounded-full py-[10px] font-body-sm text-body-sm font-medium hover:opacity-90 active:scale-[0.98] transition-all" id="btn-send-otp" type="button">

<script>
        document.getElementById('btn-send-otp').addEventListener('click', function() {
            const emailInput = document.getElementById('email');
            if(emailInput.value) {
                // Simulate sending OTP and showing Step 2
                const btn = this;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[16px]">sync</span>';
                btn.classList.add('opacity-75', 'cursor-not-allowed');
                
                setTimeout(() => {
                    document.getElementById('step-1').classList.add('hidden');
                    const step2 = document.getElementById('step-2');
                    step2.classList.remove('hidden');
                    // slight delay to allow display:block to apply before animating opacity
                    setTimeout(() => {
                        step2.classList.remove('opacity-0');
                    }, 50);
                }, 800);
            }
        });
    </script>
