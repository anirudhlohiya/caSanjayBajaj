<body class="bg-background min-h-screen flex flex-col items-center justify-center p-md selection:bg-on-background selection:text-background relative overflow-hidden">
<!-- Atmospheric background gradient -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03]" style="background-image: radial-gradient(circle at 50% 50%, #000 1px, transparent 1px); background-size: 32px 32px;"></div>
<!-- TopAppBar equivalent structural replacement for login screen (suppressing full shell) -->
<div class="absolute top-0 left-0 w-full p-lg flex justify-center md:justify-start pointer-events-none">
<div class="font-display-md text-display-md font-bold tracking-tight text-primary">GST.Manager</div>
</div>
<!-- Main Container -->
<main class="w-full max-w-[400px] z-10 relative">
<!-- Interactive Form Wrapper -->
<div class="bg-canvas-soft border border-hairline rounded-lg p-xl shadow-[0_1px_0_0_rgba(0,0,0,0.05),0_4px_6px_-1px_rgba(0,0,0,0.02)] flex flex-col gap-xl">
<!-- Header -->
<header class="flex flex-col gap-xs">
<h1 class="font-display-lg text-display-lg text-on-background">Reset Password.</h1>
<p class="font-body-sm text-body-sm text-secondary">Follow the steps to regain access to your account.</p>
</header>
<!-- Step Indicators -->
<div aria-label="Progress" class="flex gap-xs">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-hairline rounded-full"></div>
<div class="h-1 flex-1 bg-hairline rounded-full"></div>
</div>
<!-- Form Flow (Currently showing Step 1 conceptually, but structuring for single view as requested) -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault();">
<!-- Step 1: Email -->
<div class="flex flex-col gap-xs group">
<label class="font-label-mono text-label-mono text-secondary uppercase" for="email">Step 1. Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-secondary pointer-events-none" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-background border border-hairline rounded-DEFAULT pl-10 pr-sm py-sm font-body-md text-body-md text-on-background focus:outline-none focus:border-hairline focus:ring-1 focus:ring-primary placeholder:text-outline-variant transition-shadow" id="email" name="email" placeholder="administrator@gst.manager" type="email">
</div>
<button class="mt-sm bg-primary text-on-primary font-body-sm text-body-sm py-sm px-md rounded-full hover:bg-tertiary transition-colors w-max" type="button">Send OTP</button>
</div>
<!-- Divider -->
<hr class="border-t border-hairline my-xs">
<!-- Step 2: OTP -->
<div class="flex flex-col gap-xs opacity-50 pointer-events-none" style="transition: opacity 0.3s ease;">
<label class="font-label-mono text-label-mono text-secondary uppercase" for="otp">Step 2. Enter OTP</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-secondary pointer-events-none" style="font-variation-settings: 'FILL' 0;">password</span>
<input class="w-full bg-background border border-hairline rounded-DEFAULT pl-10 pr-sm py-sm font-body-md text-body-md text-on-background focus:outline-none focus:border-hairline focus:ring-1 focus:ring-primary placeholder:text-outline-variant transition-shadow" disabled="" id="otp" name="otp" placeholder="Enter 6-digit code" type="text">
</div>
</div>
<!-- Divider -->
<hr class="border-t border-hairline my-xs">
<!-- Step 3: New Password -->
<div class="flex flex-col gap-xs opacity-50 pointer-events-none" style="transition: opacity 0.3s ease;">
<label class="font-label-mono text-label-mono text-secondary uppercase">Step 3. New Credentials</label>
<div class="flex flex-col gap-sm mt-xs">
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-secondary pointer-events-none" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-background border border-hairline rounded-DEFAULT pl-10 pr-sm py-sm font-body-md text-body-md text-on-background focus:outline-none focus:border-hairline focus:ring-1 focus:ring-primary placeholder:text-outline-variant transition-shadow" disabled="" id="new_password" name="new_password" placeholder="New Password" type="password">
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-secondary pointer-events-none" style="font-variation-settings: 'FILL' 0;">lock_reset</span>
<input class="w-full bg-background border border-hairline rounded-DEFAULT pl-10 pr-sm py-sm font-body-md text-body-md text-on-background focus:outline-none focus:border-hairline focus:ring-1 focus:ring-primary placeholder:text-outline-variant transition-shadow" disabled="" id="confirm_password" name="confirm_password" placeholder="Confirm Password" type="password">
</div>
</div>
</div>
<!-- Primary Action -->
<div class="mt-md">
<button class="w-full bg-background border border-hairline text-on-background font-body-md text-body-md py-sm px-md rounded-full hover:bg-canvas-inset transition-colors opacity-50 cursor-not-allowed" disabled="" type="submit">Reset Password</button>
</div>
</form>
<div class="text-center mt-xs">
<a class="font-label-mono text-label-mono text-secondary hover:text-primary transition-colors uppercase" href="#">Return to Login</a>
</div>
</div>
</main>
</body></html>
