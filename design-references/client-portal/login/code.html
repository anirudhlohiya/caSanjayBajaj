<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Material 3 Outlined Input Styles */
        .m3-input-container {
            position: relative;
            margin-top: 8px;
            margin-bottom: 8px;
            width: 100%;
        }
        
        .m3-input {
            width: 100%;
            height: 56px;
            padding: 0 16px;
            background-color: transparent;
            border: 1px solid theme('colors.outline-variant');
            border-radius: theme('borderRadius.DEFAULT');
            color: theme('colors.on-surface');
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            transition: all 0.2s ease;
            outline: none;
        }
        
        .m3-input:focus {
            border: 2px solid theme('colors.secondary');
            padding: 0 15px; /* Adjust padding to prevent shift when border thickens */
        }
        
        .m3-label {
            position: absolute;
            left: 16px;
            top: 16px;
            color: theme('colors.on-surface-variant');
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.2s ease;
            background-color: theme('colors.surface-container-lowest');
            padding: 0 4px;
            margin-left: -4px;
        }
        
        .m3-input:focus ~ .m3-label,
        .m3-input:not(:placeholder-shown) ~ .m3-label {
            top: -8px;
            left: 12px;
            font-size: 12px;
            color: theme('colors.secondary');
            font-weight: 500;
        }
        
        .m3-input:not(:focus):not(:placeholder-shown) ~ .m3-label {
            color: theme('colors.on-surface-variant');
        }
        
        .m3-icon {
            position: absolute;
            right: 16px;
            top: 16px;
            color: theme('colors.on-surface-variant');
            cursor: pointer;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest min-h-screen flex items-center justify-center p-4 text-on-surface">
<div class="w-full max-w-md">
<!-- Logo Area -->
<div class="flex flex-col items-center justify-center mb-10">
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center mb-4 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="account_balance">account_balance</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary text-center">CA Firm Portal</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">Secure access for clients</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-6 md:p-8 shadow-[0_2px_8px_rgba(18,41,77,0.05)]">
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="m3-input-container">
<input class="m3-input" id="email" placeholder=" " required="" type="email"/>
<label class="m3-label" for="email">Email address</label>
</div>
<!-- Password Input -->
<div class="m3-input-container">
<input class="m3-input pr-12" id="password" placeholder=" " required="" type="password"/>
<label class="m3-label" for="password">Password</label>
<span class="material-symbols-outlined m3-icon" data-icon="visibility_off" id="togglePassword">visibility_off</span>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-1 mb-2">
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors focus:outline-none focus:underline" href="#">Forgot password?</a>
</div>
<!-- Login Button -->
<button class="w-full h-[48px] bg-primary-container text-on-primary rounded-lg font-label-lg text-label-lg mt-2 flex items-center justify-center gap-2 hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary shadow-sm" type="submit">
                    Login
                    <span class="material-symbols-outlined text-sm" data-icon="login">login</span>
</button>
</form>
<!-- Help Text -->
<div class="mt-8 text-center border-t border-outline-variant pt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Need help accessing your account?<br/>
<a class="text-secondary hover:underline" href="#">Contact our support team</a>
</p>
</div>
</div>
<!-- Footer -->
<div class="mt-12 text-center">
<p class="font-label-md text-label-md text-on-tertiary-container">© 2024 CA Firm Portal. All rights reserved.</p>
</div>
</div>
<script>
        // Simple password toggle visibility script
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            
            if (type === 'password') {
                this.textContent = 'visibility_off';
                this.setAttribute('data-icon', 'visibility_off');
            } else {
                this.textContent = 'visibility';
                this.setAttribute('data-icon', 'visibility');
            }
        });
    </script>
</body></html>
