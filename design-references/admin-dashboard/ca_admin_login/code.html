<!DOCTYPE html>

<body class="h-full flex items-center justify-center bg-background p-container-margin font-body-md text-body-md text-on-background">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant p-xl flex flex-col gap-lg">
<!-- Branding -->
<div class="flex flex-col items-center justify-center gap-sm">
<div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-secondary">CA Admin</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Corporate Accounts Portal</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">mail</span>
<input class="w-full pl-10 pr-3 py-2 border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary-fixed-dim transition-all" id="email" name="email" placeholder="admin@firm.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">lock</span>
<input class="w-full pl-10 pr-3 py-2 border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary-fixed-dim transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center gap-sm mt-sm">
<input class="w-4 h-4 text-secondary border-outline-variant rounded focus:ring-secondary focus:ring-2 bg-surface-container-lowest" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember">Remember me for 30 days</label>
</div>
<button class="mt-sm w-full bg-primary hover:bg-secondary text-on-primary font-headline-sm text-headline-sm py-2 px-4 rounded-DEFAULT transition-colors flex items-center justify-center gap-sm" type="submit">
                Login
                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<!-- Footer Info -->
<div class="text-center border-t border-outline-variant pt-md mt-sm">
<p class="font-body-sm text-body-sm text-outline">
                Secure institutional access only. <br/>
<a class="text-secondary hover:underline" href="#">Terms of Service</a> • <a class="text-secondary hover:underline" href="#">Privacy Policy</a>
</p>
</div>
</div>
</body></html>
