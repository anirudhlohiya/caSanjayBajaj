<div class="flex flex-col gap-4 pb-10">
  <app-page-header title="Notifications" [back]="true">
    @if (hasUnread()) {
      <button
        (click)="markAllRead()"
        class="rounded-full bg-surface-variant px-3 py-1.5 text-body-md font-semibold text-on-surface-variant"
      >
        Mark all read
      </button>
    }
  </app-page-header>

  @if (loading()) {
    <app-spinner />
  } @else if (items().length === 0) {
    <div class="rounded-2xl border border-card-border bg-surface-container-lowest">
      <app-empty-state
        icon="notifications_none"
        title="No notifications"
        message="Updates about your documents and reports will show up here."
      />
    </div>
  } @else {
    <div class="flex flex-col gap-2">
      @for (item of items(); track item.id) {
        <button
          (click)="open(item)"
          class="flex items-start gap-3 rounded-xl border border-card-border bg-surface-container-lowest p-3 text-left shadow-card"
        >
          <span class="mt-0.5 flex size-9 shrink-0 items-center justify-center rounded-full"
            [class]="item.is_read ? 'bg-surface-variant text-on-surface-variant' : 'bg-report-ready-bg text-report-ready'">
            <span class="material-symbols-outlined text-[20px]">notifications</span>
          </span>
          <div class="min-w-0 flex-1">
            <div class="flex items-center justify-between gap-2">
              <p class="truncate text-body-md font-semibold text-on-surface">{{ item.title }}</p>
              @if (!item.is_read) {
                <span class="size-2.5 shrink-0 rounded-full bg-error"></span>
              }
            </div>
            <p class="mt-0.5 text-body-md text-on-surface-variant">{{ item.body }}</p>
            <p class="mt-1 text-label-md text-on-surface-variant">{{ timeAgo(item.created_at) }}</p>
          </div>
          @if (item.deep_link) {
            <span class="mt-1 material-symbols-outlined text-[18px] text-on-surface-variant">chevron_right</span>
          }
        </button>
      }
    </div>

    @if (totalPages() > 1) {
      <div class="flex items-center justify-between gap-2 pt-1">
        <button
          (click)="prev()"
          [disabled]="page() <= 1"
          class="px-3 py-1.5 text-sm rounded-lg border border-outline-variant disabled:opacity-40">
          Previous
        </button>
        <span class="text-xs text-on-surface-variant">Page {{ page() }} of {{ totalPages() }}</span>
        <button
          (click)="next()"
          [disabled]="page() >= totalPages()"
          class="px-3 py-1.5 text-sm rounded-lg border border-outline-variant disabled:opacity-40">
          Next
        </button>
      </div>
    }
  }
</div>
