<app-auth-layout heroTitle="Create Account" heroSubtitle="Join S N Bajaj And Co">
  <app-toast-container />

  @if (error()) {
    <div class="mb-4 flex items-center gap-2 rounded-lg border border-red-100 bg-red-50 px-3 py-2.5 text-xs text-red-700">
      <span class="material-symbols-outlined text-[18px]">error</span>
      <span>{{ error() }}</span>
    </div>
  }

  <!-- STEP 1: Email Form -->
  @if (step() === 'email') {
    <form [formGroup]="emailForm" (ngSubmit)="requestOtp()" class="flex flex-col gap-4">
      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold uppercase tracking-wider text-neutral-400">Email</span>
        <input
          formControlName="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          class="h-11 rounded-md border border-neutral-200 bg-neutral-50 px-3 text-sm text-neutral-800 outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-200/50"
        />
      </label>

      @if (emailForm.controls.email.touched && emailForm.controls.email.invalid) {
        <p class="text-xs text-red-600">Enter a valid email address.</p>
      }

      <button
        type="submit"
        [disabled]="emailForm.invalid || loading()"
        class="mt-2 flex h-11 items-center justify-center gap-2 rounded-lg bg-neutral-900 text-sm font-semibold text-white transition hover:bg-neutral-800 disabled:opacity-50 cursor-pointer"
      >
        @if (loading()) {
          <span class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
        }
        Send Verification OTP
      </button>

      <div class="mt-4 text-center">
        <p class="text-xs text-neutral-500">
          Already have an account?
          <a routerLink="/login" class="font-semibold text-neutral-900 hover:underline">Sign in</a>
        </p>
      </div>
    </form>
  }

  <!-- STEP 2: Verification and Signup Form -->
  @if (step() === 'verify') {
    <form [formGroup]="signupForm" (ngSubmit)="verifyAndSignup()" class="flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <span class="text-xs text-neutral-500">Verifying: <strong class="text-neutral-900">{{ emailForm.controls.email.value }}</strong></span>
        <button type="button" (click)="backToEmail()" class="text-xs font-semibold text-neutral-900 hover:underline flex items-center gap-1 cursor-pointer">
          <span class="material-symbols-outlined text-[16px]">edit</span> Edit
        </button>
      </div>

      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold uppercase tracking-wider text-neutral-400">6-Digit OTP Code</span>
        <input
          formControlName="otp_code"
          type="text"
          pattern="[0-9]*"
          inputmode="numeric"
          maxlength="6"
          placeholder="000000"
          class="h-11 text-center text-lg tracking-[6px] rounded-md border border-neutral-200 bg-neutral-50 px-3 text-neutral-800 outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-200/50"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold uppercase tracking-wider text-neutral-400">Full Name</span>
        <input
          formControlName="name"
          type="text"
          placeholder="John Doe"
          class="h-11 rounded-md border border-neutral-200 bg-neutral-50 px-3 text-sm text-neutral-800 outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-200/50"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold uppercase tracking-wider text-neutral-400">Phone Number (Optional)</span>
        <input
          formControlName="phone"
          type="tel"
          placeholder="+91 98765 43210"
          class="h-11 rounded-md border border-neutral-200 bg-neutral-50 px-3 text-sm text-neutral-800 outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-200/50"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold uppercase tracking-wider text-neutral-400">GSTIN (Optional)</span>
        <input
          formControlName="gstin"
          type="text"
          maxlength="15"
          placeholder="29ABCDE1234F1Z5"
          class="h-11 rounded-md border border-neutral-200 bg-neutral-50 px-3 text-sm font-mono text-neutral-800 outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-200/50"
        />
        <span class="text-xs text-neutral-400">Enter your 15-character GSTIN if you are a GST-registered business</span>
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold uppercase tracking-wider text-neutral-400">Password</span>
        <input
          formControlName="password"
          type="password"
          placeholder="At least 8 characters"
          class="h-11 rounded-md border border-neutral-200 bg-neutral-50 px-3 text-sm text-neutral-800 outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-200/50"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold uppercase tracking-wider text-neutral-400">Confirm Password</span>
        <input
          formControlName="confirm_password"
          type="password"
          placeholder="Repeat password"
          class="h-11 rounded-md border border-neutral-200 bg-neutral-50 px-3 text-sm text-neutral-800 outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-200/50"
        />
      </label>

      <button
        type="submit"
        [disabled]="signupForm.invalid || loading()"
        class="mt-2 flex h-11 items-center justify-center gap-2 rounded-lg bg-neutral-900 text-sm font-semibold text-white transition hover:bg-neutral-800 disabled:opacity-50 cursor-pointer"
      >
        @if (loading()) {
          <span class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
        }
        Verify &amp; Register
      </button>
    </form>
  }
</app-auth-layout>
