<app-auth-layout heroTitle="Reset Password." heroSubtitle="Follow the steps to regain access to your account.">
  <app-toast-container />

  @if (error()) {
    <div class="mb-6 flex items-center gap-2 rounded-xl bg-error-container px-3 py-2.5 text-sm text-on-error-container" role="alert">
      <span class="material-symbols-outlined text-[18px]">error</span>
      <span>{{ error() }}</span>
    </div>
  }

  <!-- STEP 1: Email Request -->
  @if (step() === 'email') {
    <form [formGroup]="emailForm" (ngSubmit)="requestOtp()" class="flex flex-col gap-6">
      <div class="flex flex-col gap-1">
        <label class="field-label" for="email">Email address</label>
        <input
          formControlName="email"
          id="email"
          type="email"
          autocomplete="email"
          placeholder="sanjay@example.com"
          class="field-input"
        />
      </div>

      @if (emailForm.controls.email.touched && emailForm.controls.email.invalid) {
        <p class="text-xs text-error -mt-4">Enter a valid email address.</p>
      }

      <button
        type="submit"
        [disabled]="emailForm.invalid || loading()"
        class="btn-primary flex h-12 w-full items-center justify-center gap-2 text-[15px] active:scale-[0.98]"
      >
        @if (loading()) {
          <span class="size-4 animate-spin rounded-full border-2 border-on-brand/40 border-t-on-brand"></span>
        }
        Send Reset OTP
      </button>

      <div class="text-center pt-2">
        <p class="text-sm text-on-surface-variant">
          Remembered your password?
          <a routerLink="/login" class="font-semibold text-link hover:underline">Sign in</a>
        </p>
      </div>
    </form>
  }

  <!-- STEP 2: Verify & Reset -->
  @if (step() === 'verify') {
    <form [formGroup]="resetForm" (ngSubmit)="verifyAndReset()" class="flex flex-col gap-6">
      <div class="card flex items-center justify-between gap-2 py-1 pl-4 pr-2">
        <span class="text-sm text-on-surface-variant">Resetting: <strong class="text-on-surface">{{ emailForm.controls.email.value }}</strong></span>
        <button type="button" (click)="backToEmail()" class="flex min-h-11 items-center gap-1 text-sm font-semibold text-link hover:underline cursor-pointer">
          <span class="material-symbols-outlined text-[16px]">edit</span> Edit
        </button>
      </div>

      <div class="flex flex-col gap-1">
        <label class="field-label" for="otp_code">6-Digit OTP Code</label>
        <input
          formControlName="otp_code"
          id="otp_code"
          type="text"
          pattern="[0-9]*"
          inputmode="numeric"
          maxlength="6"
          placeholder="000000"
          class="field-input h-14 text-center text-2xl font-semibold tracking-[10px] disabled:cursor-not-allowed"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="field-label" for="new_password">New Password</label>
        <div class="relative">
          <input
            formControlName="password"
            id="new_password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="At least 8 characters"
            class="field-input pr-12"
          />
          <button
            type="button"
            (click)="showPassword.set(!showPassword())"
            class="absolute right-1 top-1/2 -translate-y-1/2 flex size-11 items-center justify-center rounded-full text-on-surface-variant hover:text-primary"
            [attr.aria-label]="showPassword() ? 'Hide passwords' : 'Show passwords'"
            [attr.aria-pressed]="showPassword()"
          >
            <span class="material-symbols-outlined text-[20px]">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="field-label" for="confirm_password">Confirm New Password</label>
        <input
          formControlName="confirm_password"
          id="confirm_password"
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Repeat new password"
          class="field-input"
        />
      </div>

      <button
        type="submit"
        [disabled]="resetForm.invalid || loading()"
        class="btn-primary flex h-12 w-full items-center justify-center gap-2 text-[15px] active:scale-[0.98]"
      >
        @if (loading()) {
          <span class="size-4 animate-spin rounded-full border-2 border-on-brand/40 border-t-on-brand"></span>
        }
        Reset Password
      </button>
    </form>
  }
</app-auth-layout>
