<app-auth-layout heroTitle="Reset Password." heroSubtitle="Follow the steps to regain access to your account.">
  <app-toast-container />

  @if (error()) {
    <div class="mb-6 flex items-center gap-2 rounded-lg border border-red-200 bg-red-50 px-3 py-2.5 text-xs text-red-700 dark:border-red-900/50 dark:bg-red-900/20 dark:text-red-400">
      <span class="material-symbols-outlined text-[18px]">error</span>
      <span>{{ error() }}</span>
    </div>
  }

  <!-- STEP 1: Email Request -->
  @if (step() === 'email') {
    <form [formGroup]="emailForm" (ngSubmit)="requestOtp()" class="flex flex-col gap-6">
      <div class="flex flex-col gap-1">
        <label class="font-geist-mono text-xs tracking-wider text-secondary" for="email">Email address</label>
        <input
          formControlName="email"
          id="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          class="w-full bg-surface-container-lowest border border-hairline rounded px-3 py-[10px] font-geist text-sm text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-shadow placeholder:text-outline-variant dark:bg-surface-container dark:border-hairline-strong dark:text-on-surface dark:focus:ring-white dark:focus:border-white"
        />
      </div>

      @if (emailForm.controls.email.touched && emailForm.controls.email.invalid) {
        <p class="font-geist text-xs text-error -mt-4">Enter a valid email address.</p>
      }

      <button
        type="submit"
        [disabled]="emailForm.invalid || loading()"
        class="flex justify-center items-center gap-2 w-full bg-primary text-on-primary font-geist text-sm font-medium rounded-full py-[10px] hover:bg-tertiary-container transition-colors active:scale-[0.98] disabled:opacity-50 cursor-pointer dark:bg-white dark:text-black dark:hover:bg-neutral-200"
      >
        @if (loading()) {
          <span class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white dark:border-black/40 dark:border-t-black"></span>
        }
        Send Reset OTP
      </button>

      <div class="text-center pt-2">
        <p class="font-geist text-sm text-on-surface-variant">
          Remembered your password?
          <a routerLink="/login" class="text-primary font-medium hover:underline dark:text-white">Sign in</a>
        </p>
      </div>
    </form>
  }

  <!-- STEP 2: Verify & Reset -->
  @if (step() === 'verify') {
    <form [formGroup]="resetForm" (ngSubmit)="verifyAndReset()" class="flex flex-col gap-6">
      <div class="flex items-center justify-between border border-hairline rounded bg-canvas-inset p-3 dark:border-hairline-strong dark:bg-surface-container">
        <span class="font-geist text-sm text-on-surface-variant">Resetting: <strong class="text-on-surface">{{ emailForm.controls.email.value }}</strong></span>
        <button type="button" (click)="backToEmail()" class="font-geist-mono text-xs font-semibold text-primary hover:underline flex items-center gap-1 cursor-pointer dark:text-white">
          <span class="material-symbols-outlined text-[16px]">edit</span> Edit
        </button>
      </div>

      <div class="flex flex-col gap-1">
        <label class="font-geist-mono text-xs tracking-wider text-secondary" for="otp_code">6-Digit OTP Code</label>
        <input
          formControlName="otp_code"
          id="otp_code"
          type="text"
          pattern="[0-9]*"
          inputmode="numeric"
          maxlength="6"
          placeholder="000000"
          class="w-full h-12 text-center text-xl tracking-[8px] bg-surface-container-lowest border border-hairline rounded px-3 font-geist text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-shadow placeholder:text-outline-variant dark:bg-surface-container dark:border-hairline-strong dark:text-on-surface dark:focus:ring-white dark:focus:border-white"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="font-geist-mono text-xs tracking-wider text-secondary" for="new_password">New Password</label>
        <input
          formControlName="password"
          id="new_password"
          type="password"
          placeholder="At least 8 characters"
          class="w-full bg-surface-container-lowest border border-hairline rounded px-3 py-[10px] font-geist text-sm text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-shadow placeholder:text-outline-variant dark:bg-surface-container dark:border-hairline-strong dark:text-on-surface dark:focus:ring-white dark:focus:border-white"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="font-geist-mono text-xs tracking-wider text-secondary" for="confirm_password">Confirm New Password</label>
        <input
          formControlName="confirm_password"
          id="confirm_password"
          type="password"
          placeholder="Repeat new password"
          class="w-full bg-surface-container-lowest border border-hairline rounded px-3 py-[10px] font-geist text-sm text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-shadow placeholder:text-outline-variant dark:bg-surface-container dark:border-hairline-strong dark:text-on-surface dark:focus:ring-white dark:focus:border-white"
        />
      </div>

      <button
        type="submit"
        [disabled]="resetForm.invalid || loading()"
        class="flex justify-center items-center gap-2 w-full bg-primary text-on-primary font-geist text-sm font-medium rounded-full py-[10px] hover:bg-tertiary-container transition-colors active:scale-[0.98] disabled:opacity-50 cursor-pointer dark:bg-white dark:text-black dark:hover:bg-neutral-200"
      >
        @if (loading()) {
          <span class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white dark:border-black/40 dark:border-t-black"></span>
        }
        Reset Password
      </button>
    </form>
  }
</app-auth-layout>
