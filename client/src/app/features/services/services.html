<div class="max-w-container-max mx-auto px-4 pt-4">
  <!-- Search Bar -->
  <div class="relative mb-6">
    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">search</span>
    <input
      type="text"
      placeholder="Find a service (e.g., GST, ITR, Audit)"
      [(ngModel)]="searchQuery"
      class="w-full bg-surface-container border border-outline-variant rounded-xl py-3 pl-10 pr-4 text-sm text-primary placeholder:text-on-surface-variant focus:outline-none focus:border-outline focus:ring-1 focus:ring-outline"
    />
  </div>

  <!-- Services List -->
  <div class="flex flex-col gap-4">
    @for (service of filteredServices; track service.id) {
      <!-- Card -->
      <div (click)="onServiceClick()" class="bg-surface rounded-2xl p-4 shadow-card cursor-pointer hover:bg-surface-container transition-colors border border-card-border">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center">
            <span class="material-symbols-outlined text-[20px] text-primary">{{ service.icon }}</span>
          </div>
          <h3 class="font-bold text-primary text-base">{{ service.title }}</h3>
        </div>
        <p class="text-[11px] text-on-surface-variant leading-relaxed mb-4">
          {{ service.description }}
        </p>
        <div class="flex flex-wrap gap-2">
          @for (tag of service.tags; track tag) {
            <span class="bg-surface-container text-primary text-[10px] px-2 py-1 rounded-md font-mono">{{ tag }}</span>
          }
        </div>
      </div>
    }

    @if (filteredServices.length === 0) {
      <div class="text-center py-8 text-on-surface-variant">
        No services found for "{{ searchQuery }}".
      </div>
    }
  </div>
</div>
