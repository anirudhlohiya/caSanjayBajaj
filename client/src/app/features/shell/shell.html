<div class="mx-auto flex min-h-dvh w-full max-w-md flex-col bg-surface">
  <app-toast-container />

  @if (!online()) {
    <div class="flex items-center gap-2 bg-error-container px-4 py-2 text-body-md font-medium text-on-error-container">
      <span class="material-symbols-outlined text-[18px]">cloud_off</span>
      You're offline — uploads will be queued and retried.
    </div>
  }

  <header class="sticky top-0 z-30 border-b border-card-border bg-surface-container-lowest/95 backdrop-blur">
    <div class="flex items-center gap-3 px-4 py-3">
      <div class="flex size-9 items-center justify-center rounded-lg bg-primary-container text-on-primary-container">
        <span class="material-symbols-outlined text-[20px]">account_balance</span>
      </div>
      <div class="min-w-0 flex-1">
        <p class="truncate text-title-lg font-semibold text-on-surface">GST Portal</p>
        <p class="truncate text-label-md text-on-surface-variant">CA Sanjay Bajaj &amp; Co.</p>
      </div>
      <button
        routerLink="/notifications"
        class="relative flex size-10 items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-variant"
        aria-label="Notifications"
      >
        <span class="material-symbols-outlined">notifications</span>
      </button>
      <button
        (click)="router.navigate(['/profile'])"
        class="flex size-10 items-center justify-center rounded-full bg-secondary-container text-on-secondary-container"
        aria-label="Profile"
      >
        {{ initials() }}
      </button>
    </div>
  </header>

  <main class="flex-1 px-4 pb-24 pt-4">
    <router-outlet />
  </main>

  <nav class="fixed inset-x-0 bottom-0 z-30 mx-auto w-full max-w-md border-t border-card-border bg-surface-container-lowest">
    <div class="grid grid-cols-4">
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          #rla="routerLinkActive"
          [class]="
            'flex flex-col items-center gap-0.5 py-2 text-[11px] font-medium transition-colors ' +
            (rla.isActive
              ? 'text-on-secondary-container'
              : 'text-on-surface-variant')
          "
        >
          <span
            [class]="
              'flex w-14 items-center justify-center rounded-full py-1 ' +
              (rla.isActive ? 'bg-secondary-container' : '')
            "
          >
            <span class="material-symbols-outlined text-[22px]" [class.symbol-filled]="rla.isActive">
              {{ item.icon }}
            </span>
          </span>
          {{ item.label }}
        </a>
      }
    </div>
  </nav>
</div>
