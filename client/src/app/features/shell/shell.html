<div class="mx-auto flex min-h-dvh w-full max-w-md flex-col bg-surface">
  <app-toast-container />

  @if (!online()) {
    <div class="flex items-center gap-2 bg-error-container px-4 py-2 text-body-md font-medium text-on-error-container">
      <span class="material-symbols-outlined text-[18px]">cloud_off</span>
      You're offline — uploads will be queued and retried.
    </div>
  }

  <header class="sticky top-0 z-30 border-b border-neutral-100 bg-white/90 backdrop-blur-md">
    <div class="flex items-center gap-3 px-4 py-3">
      <div class="flex size-9 items-center justify-center rounded-lg bg-neutral-900 text-white shadow-sm">
        <span class="material-symbols-outlined text-[18px]">account_balance</span>
      </div>
      <div class="min-w-0 flex-1">
        <p class="truncate text-title-lg font-semibold text-neutral-950 tracking-tight">SN Bajaj And Co</p>
        <p class="truncate text-label-md text-neutral-400 font-medium">GST Client Portal</p>
      </div>
      <button
        routerLink="/notifications"
        class="relative flex size-10 items-center justify-center rounded-full text-neutral-500 hover:bg-neutral-100 hover:text-neutral-950 transition-colors cursor-pointer"
        aria-label="Notifications"
      >
        <span class="material-symbols-outlined text-[20px]">notifications</span>
      </button>
      <button
        (click)="router.navigate(['/profile'])"
        class="flex size-9 items-center justify-center rounded-full bg-neutral-100 text-neutral-700 font-mono text-xs font-semibold hover:bg-neutral-200 transition-colors cursor-pointer"
        aria-label="Profile"
      >
        {{ initials() }}
      </button>
    </div>
  </header>

  <main class="flex-1 px-4 pb-24 pt-4">
    <router-outlet />
  </main>

  <nav class="fixed inset-x-0 bottom-0 z-30 mx-auto w-full max-w-md border-t border-neutral-100 bg-white/95 backdrop-blur-md">
    <div class="grid grid-cols-4">
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          #rla="routerLinkActive"
          [class]="
            'flex flex-col items-center gap-0.5 py-2 text-[11px] font-medium transition-colors ' +
            (rla.isActive
              ? 'text-neutral-950 font-semibold'
              : 'text-neutral-400 hover:text-neutral-600')
          "
        >
          <span
            [class]="
              'flex w-12 items-center justify-center rounded-full py-0.5 transition-all ' +
              (rla.isActive ? 'bg-neutral-100 text-neutral-950' : '')
            "
          >
            <span class="material-symbols-outlined text-[20px]" [class.symbol-filled]="rla.isActive">
              {{ item.icon }}
            </span>
          </span>
          {{ item.label }}
        </a>
      }
    </div>
  </nav>
</div>
