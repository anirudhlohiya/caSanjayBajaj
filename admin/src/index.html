  <!-- Apply the saved theme before first paint so a refresh never flashes light mode (mirrors ThemeService, key adm_theme). -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('adm_theme') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* storage blocked: stay light */ }
    })();
  </script>
