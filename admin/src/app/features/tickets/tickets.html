<app-page-header title="Support Tickets" subtitle="Manage client support requests and document inquiries" />

<div class="flex flex-wrap items-center gap-2 mb-4" role="group" aria-label="Filter tickets">
  @for (f of filters; track f.value) {
    <button
      type="button"
      class="h-9 px-3.5 rounded-full text-sm font-medium transition-colors cursor-pointer inline-flex items-center gap-1.5"
      [class]="statusFilter() === f.value ? 'bg-brand text-on-brand' : 'bg-surface-container text-on-surface-variant hover:text-on-surface'"
      [attr.aria-pressed]="statusFilter() === f.value"
      (click)="filterByStatus(f.value)"
    >
      {{ f.label }}
      @if (counts()[f.value] !== undefined) {
        <span class="tabular-nums opacity-75">{{ counts()[f.value] }}</span>
      }
    </button>
  }
</div>

<div class="card overflow-hidden">
  @if (loading()) {
    <app-spinner />
  } @else {
    <div class="divide-y divide-outline-variant">
      @for (t of tickets(); track t.id) {
        <div class="p-4 cursor-pointer hover:bg-row-hover transition-colors" (click)="openTicket(t.id)">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <h3 class="text-sm font-semibold text-on-surface truncate">{{ t.subject }}</h3>
                <app-status-chip [status]="t.status" />
              </div>
              <p class="text-xs text-on-surface-variant mt-1">
                {{ t.user?.name ?? 'Unknown' }} &middot; {{ t.category.replace('_', ' ') }} &middot; {{ fmtDate(t.created_at) }}
              </p>
            </div>
            <span class="material-symbols-outlined text-outline" style="font-size: 20px">chevron_right</span>
          </div>
        </div>
      } @empty {
        <div class="p-8">
          <app-empty-state icon="support_agent" message="No tickets yet" hint="Client support requests will appear here" />
        </div>
      }
    </div>
    @if (total() > 0) {
      <div class="p-2 border-t border-outline-variant bg-surface-bright">
        <app-pagination
          [page]="page()"
          [pageSize]="pageSize()"
          [total]="total()"
          [totalPages]="totalPages()"
          (pageChange)="pageChanged($event)"
        />
      </div>
    }
  }
</div>
